<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t">
<title id="t">Grundriss Chalet Säntisblick, Erdgeschoss und Obergeschoss</title>
<defs>
  <style>
    .w{fill:none;stroke:#EFE9DF;stroke-width:3}
    .i{fill:none;stroke:#EFE9DF;stroke-width:1.4;opacity:.7}
    .r{fill:#1C1A18}
    .rs{fill:#221F1C}
    .g{fill:none;stroke:#B89A63;stroke-width:1.2;stroke-dasharray:4 5;opacity:.85}
    .n{font:500 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#EFE9DF;letter-spacing:.02em}
    .m{font:400 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#8C847A}
    .h{font:400 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#B89A63;letter-spacing:.22em;text-transform:uppercase}
    .d{fill:none;stroke:#8C847A;stroke-width:1;opacity:.6}
  </style>
</defs>

<!-- ================= ERDGESCHOSS ================= -->
<text class="h" x="60" y="44">ERDGESCHOSS · 118 M²</text>

<!-- Aussenwand -->
<rect class="rs" x="60" y="70" width="500" height="380"/>
<rect class="w" x="60" y="70" width="500" height="380"/>

<!-- Terrasse (Sued, unten) -->
<rect class="g" x="60" y="450" width="500" height="120"/>
<text class="n" x="80" y="500">Terrasse</text>
<text class="m" x="80" y="520">Südwesten · Holzbottich · 48 m²</text>
<circle class="i" cx="500" cy="510" r="26"/>
<text class="m" x="484" y="555">Bottich</text>

<!-- Wohnraum (gross, Sued) -->
<rect class="r" x="60" y="230" width="330" height="220"/>
<text class="n" x="80" y="262">Wohnraum</text>
<text class="m" x="80" y="282">6 m Höhe · Cheminée · 54 m²</text>
<!-- Cheminee -->
<rect class="i" x="60" y="300" width="18" height="60"/>
<!-- Sofa -->
<rect class="i" x="150" y="360" width="150" height="50" rx="6"/>
<!-- Glasfront markiert -->
<line x1="80" y1="450" x2="370" y2="450" stroke="#B89A63" stroke-width="5" opacity=".9"/>

<!-- Kueche & Essen -->
<rect class="r" x="390" y="230" width="170" height="220"/>
<line class="w" x1="390" y1="230" x2="390" y2="450"/>
<text class="n" x="408" y="262">Küche &amp; Essen</text>
<text class="m" x="408" y="282">Tisch für 8 · 32 m²</text>
<!-- Insel -->
<rect class="i" x="410" y="300" width="60" height="26"/>
<!-- Tisch -->
<rect class="i" x="420" y="360" width="110" height="34"/>

<!-- Eingang / Skiraum (Nord-Ost) -->
<rect class="r" x="390" y="70" width="170" height="160"/>
<line class="w" x1="60" y1="230" x2="560" y2="230"/>
<line class="w" x1="390" y1="70" x2="390" y2="230"/>
<text class="n" x="408" y="102">Eingang · Skiraum</text>
<text class="m" x="408" y="122">beheizt · 16 m²</text>
<!-- Eingangstuer -->
<path class="d" d="M520 70 a24 24 0 0 1 24 24" />
<line class="w" x1="520" y1="70" x2="520" y2="94"/>

<!-- Spa (Nord-West) -->
<rect class="r" x="60" y="70" width="330" height="160"/>
<text class="n" x="80" y="102">Spa</text>
<text class="m" x="80" y="122">Sauna · Ruheraum · Bad · 30 m²</text>
<line class="i" x1="180" y1="70" x2="180" y2="230"/>
<text class="m" x="72" y="200">Sauna</text>
<text class="m" x="196" y="200">Ruheraum</text>
<line class="i" x1="300" y1="70" x2="300" y2="230"/>
<text class="m" x="312" y="200">Bad · WC</text>

<!-- Treppe -->
<rect class="i" x="330" y="240" width="52" height="90"/>
<line class="i" x1="330" y1="255" x2="382" y2="255"/>
<line class="i" x1="330" y1="270" x2="382" y2="270"/>
<line class="i" x1="330" y1="285" x2="382" y2="285"/>
<line class="i" x1="330" y1="300" x2="382" y2="300"/>
<line class="i" x1="330" y1="315" x2="382" y2="315"/>
<text class="m" x="336" y="345">Treppe</text>

<!-- Kompass -->
<text class="m" x="580" y="120">N</text>
<line class="d" x1="586" y1="126" x2="586" y2="160"/>
<polygon points="586,124 581,134 591,134" fill="#8C847A"/>

<!-- ================= OBERGESCHOSS ================= -->
<text class="h" x="660" y="44">OBERGESCHOSS · 92 M²</text>

<rect class="rs" x="660" y="70" width="500" height="380"/>
<rect class="w" x="660" y="70" width="500" height="380"/>

<!-- Galerie ueber Wohnraum, offen -->
<rect class="g" x="660" y="230" width="330" height="220"/>
<text class="n" x="680" y="262">Galerie</text>
<text class="m" x="680" y="282">offen zum Wohnraum · Lesenische</text>
<text class="m" x="680" y="430" opacity=".6">Luftraum über dem Wohnraum</text>
<!-- Treppe oben -->
<rect class="i" x="930" y="240" width="52" height="90"/>
<line class="i" x1="930" y1="255" x2="982" y2="255"/>
<line class="i" x1="930" y1="270" x2="982" y2="270"/>
<line class="i" x1="930" y1="285" x2="982" y2="285"/>
<line class="i" x1="930" y1="300" x2="982" y2="300"/>
<line class="i" x1="930" y1="315" x2="982" y2="315"/>

<!-- Saentis mit Bad (Sued-Ost, der groesste) -->
<rect class="r" x="990" y="230" width="170" height="220"/>
<line class="w" x1="990" y1="230" x2="990" y2="450"/>
<text class="n" x="1008" y="262">Säntis</text>
<text class="m" x="1008" y="282">Bett 200 · Wanne · 28 m²</text>
<rect class="i" x="1010" y="300" width="70" height="60"/>
<text class="m" x="1016" y="335">Bett</text>
<line class="i" x1="1090" y1="300" x2="1090" y2="450"/>
<ellipse class="i" cx="1125" cy="400" rx="22" ry="14"/>
<text class="m" x="1098" y="440">Bad</text>
<line x1="1010" y1="450" x2="1140" y2="450" stroke="#B89A63" stroke-width="5" opacity=".9"/>

<!-- Laerche (Nord-West) -->
<rect class="r" x="660" y="70" width="165" height="160"/>
<line class="w" x1="660" y1="230" x2="1160" y2="230"/>
<text class="n" x="678" y="102">Lärche</text>
<text class="m" x="678" y="122">Bett 180 · 16 m²</text>
<rect class="i" x="690" y="140" width="60" height="50"/>

<!-- Alpstein (Nord-Mitte) -->
<rect class="r" x="825" y="70" width="165" height="160"/>
<line class="w" x1="825" y1="70" x2="825" y2="230"/>
<text class="n" x="843" y="102">Alpstein</text>
<text class="m" x="843" y="122">Bett 180 · 16 m²</text>
<rect class="i" x="855" y="140" width="60" height="50"/>

<!-- Kammer + Bad 2 (Nord-Ost) -->
<rect class="r" x="990" y="70" width="170" height="160"/>
<line class="w" x1="990" y1="70" x2="990" y2="230"/>
<text class="n" x="1008" y="102">Kammer</text>
<text class="m" x="1008" y="122">2 Einzelbetten · 14 m²</text>
<rect class="i" x="1010" y="140" width="24" height="46"/>
<rect class="i" x="1044" y="140" width="24" height="46"/>
<line class="i" x1="1090" y1="70" x2="1090" y2="230"/>
<text class="m" x="1102" y="160">Bad 2</text>
<text class="m" x="1102" y="178">Dusche</text>
<rect class="i" x="1104" y="188" width="36" height="30"/>

<!-- Legende -->
<line x1="660" y1="500" x2="700" y2="500" stroke="#B89A63" stroke-width="5" opacity=".9"/>
<text class="m" x="712" y="505">Raumhohe Verglasung nach Süden</text>
<rect class="g" x="660" y="522" width="40" height="16"/>
<text class="m" x="712" y="535">Aussenbereich / offener Luftraum</text>
<text class="m" x="660" y="575">Alle Masse gerundet. Kein Massstab — Musterbeispiel.</text>
</svg>
